table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;

        ip daddr 172.31.255.0/24 iifname "brlan0" drop;
        iifname "privbr" accept;
        ip saddr 192.168.147.0/24 iifname "host0" accept;
        iifname "erouter0" tcp dport 22 jump ssh_filter;
        udp dport { 10161, 10163 } jump snmp_filter;

        iifname "erouter0" udp dport 123 ct state related,established accept;
        iifname "erouter0" udp dport 123 ct state new drop;

        ip saddr 127.0.0.0/8 iifname "lo" accept;
        iifname "lo" ip saddr 192.168.0.101 ip daddr 192.168.0.101 accept;
        iifname "lo" ct state new accept;

        jump general_input;

        iifname "brlan0" tcp dport 80 jump webui_limit;
        iifname "brlan0" tcp dport 443 jump webui_limit;
        iifname "brlan0" tcp dport { 80, 443 } accept;
        iifname "erouter0" tcp dport { 80, 443 } accept;
        iifname "lan0" tcp dport { 80, 443 } accept;
        iifname "privbr" tcp dport { 80, 443 } accept;
        tcp dport { 80, 443 } drop;

        iifname "brlan1" tcp dport 22 drop;
        iifname "br106" tcp dport 22 drop;
        iifname != "erouter0" tcp dport 8080 drop;
        iifname != "erouter0" tcp dport 8181 drop;

        iifname "erouter0" jump wan2self_mgmt;
        iifname "erouter0" jump wan2self;
        iifname "brlan0" jump lan2self;
        iifname "erouter0" jump wan2self;
        iifname "erouter0" icmp type echo-request limit rate 3/second jump xlog_accept_wan2self;
        iifname "erouter0" jump wan2self_ports;
        iifname "mta0" icmp type echo-request limit rate 3/second jump xlog_accept_wan2self;
        iifname "mta0" jump wan2self_ports;

        ct state related,established accept;
        ip daddr 192.168.100.1 iifname "lan0" accept;
        iifname "erouter0" udp dport { 53, 67, 514 } drop;
        iifname "erouter0" accept;

        iifname "brlan0" tcp dport 21515 accept;
        tcp dport 21515 drop;

        iifname != "brlan0" tcp dport 2601 drop;
        iifname != "brlan0" udp dport 2601 drop;

        iifname "lo" tcp dport 49152-49153 accept;
        iifname "lo" udp dport 1900 accept;

        iifname != "brlan0" tcp dport 49152-49153 drop;
        iifname != "brlan0" udp dport 1900 drop;
        iifname != "brlan0" tcp dport 21515 drop;
        iifname != "brlan0" udp dport 21515 drop;

        ip daddr 169.254.0.0/24 iifname "ath12" accept;
        iifname "ath12" pkttype != unicast accept;

        ip daddr 169.254.1.0/24 iifname "ath13" accept;
        iifname "ath13" pkttype != unicast accept;

        ip daddr 169.254.85.0/24 iifname "brebhaul" accept;
        iifname "brebhaul" pkttype != unicast accept;

        ip daddr 192.168.251.0/24 iifname "l2sd0.4090" tcp dport 6666 accept;
        ip daddr 192.168.245.0/24 iifname "br403" tcp dport 6666 accept;
        ip daddr 192.168.245.0/24 iifname "br403" accept;
        iifname "br403" pkttype != unicast accept;

		#ipv6 rule conversion
        iifname "brlan0" tcp dport 21515 accept;
        tcp dport 21515 drop;

        iifname != "brlan0" tcp dport 2601 drop;
        iifname != "brlan0" udp dport 2601 drop;

        iifname "lo" tcp dport 49152-49153 accept;
        iifname "lo" udp dport 1900 accept;

        iifname != "brlan0" tcp dport 49152-49153 drop;
        iifname != "brlan0" udp dport 1900 drop;
        iifname != "brlan0" tcp dport 21515 drop;
        iifname != "brlan0" udp dport 21515 drop;

        iifname "erouter0" tcp dport 22 jump ssh_filter;
        udp dport { 10161, 10163 } jump snmp_filter;

        iifname "erouter0" udp dport 123 ct state related,established accept;
        iifname "erouter0" udp dport 123 ct state new drop;

        iifname "brlan0" tcp dport 80 jump webui_limit;
        iifname "brlan0" tcp dport 443 jump webui_limit;
        iifname "brlan0" tcp dport { 80, 443 } accept;
        iifname "erouter0" tcp dport { 80, 443 } accept;
        iifname "lan0" tcp dport { 80, 443 } accept;
        iifname "privbr" tcp dport { 80, 443 } accept;

        iifname "brlan1" tcp dport 22 drop;
        iifname "br106" tcp dport 22 drop;
        iifname != "erouter0" tcp dport 8080 drop;
        iifname != "erouter0" tcp dport 8181 drop;

        iifname "brlan0" tcp dport 23 drop;
        iifname "lan0" tcp dport 23 drop;
        iifname "brlan0" tcp dport 22 drop;
        iifname "lan0" tcp dport 22 drop;

        iifname "lo" accept;

        rt type 0 drop;
        ct state invalid jump log_input_drop;
        # Drop all traffic from ff00::/8
        ip6 saddr ff00::/8 drop;

        # Allow limited ICMPv6 messages
        ip6 nexthdr icmpv6 icmpv6 type { 1, 2, 3, 4 } limit rate 10/second accept;
        ip6 nexthdr icmpv6 icmpv6 type 128 iifname "erouter0" jump ping_flood;
        ip6 nexthdr icmpv6 icmpv6 type 129 iifname "erouter0" limit rate 10/second accept;
        ip6 nexthdr icmpv6 icmpv6 type 128 iifname "mta0" jump ping_flood;
        ip6 nexthdr icmpv6 icmpv6 type 129 iifname "mta0" limit rate 10/second accept;

        # Allow SSH, HTTP, and HTTPS on privbr
        iifname "privbr" tcp dport { 22, 80, 443 } accept;

        # Log certain incoming ICMP requests
        ip6 daddr 2406:7400:61:db4a:da3a:ddff:fee8:698c/128 iifname "brlan0" ip6 nexthdr icmpv6 icmpv6 type 128 jump log_input_drop;

        # Allow ICMPv6 echo requests with rate limiting
        ip6 nexthdr icmpv6 icmpv6 type { 128, 129 } iifname "brlan0" limit rate 10/second accept;
        ip6 nexthdr icmpv6 icmpv6 type { 135, 136 } limit rate 100/second accept;

        # Allow IPv6 router advertisements with rate limiting
        ip6 saddr fe80::/64 ip6 daddr ff02::1 iifname != "brlan0" ip6 nexthdr icmpv6 icmpv6 type 134 limit rate 10/second accept;
        ip6 saddr fe80::/64 ip6 daddr fe80::/64 iifname != "brlan0" ip6 nexthdr icmpv6 icmpv6 type 134 limit rate 10/second accept;
        ip6 saddr fe80::/64 iifname "brlan0" ip6 nexthdr icmpv6 icmpv6 type 133 limit rate 100/second accept;

        # Allow multicast listener queries, reports, and done messages
        ip6 saddr fe80::/64 ip6 nexthdr icmpv6 icmpv6 type { 130, 131, 132, 143, 151, 152, 153 } limit rate 10/second accept;

        # Allow UDP multicast for SSDP
        iifname "brlan0" udp dport 1900 accept;

        # Log and drop specific traffic to 2406:7400
        ip6 daddr 2406:7400:61:db4a:da3a:ddff:fee8:698c/128 iifname "brlan0" tcp dport { 23, 22, 80, 443, 161 } jump log_input_drop;

        # Allow HTTP and HTTPS traffic with rate limiting
        iifname "brlan0" tcp dport { 80, 443 } tcp flags syn limit rate 10/second accept;

        # Web UI restrictions
        iifname "erouter0" tcp dport { 8080, 8181 } jump webui_limit;

        # Drop unauthorized access attempts
        iifname != "brlan0" tcp dport { 23, 8080, 80, 443, 8181 } drop;

        # Allow established connections
        ct state related,established accept;

        # Drop unauthorized UDP traffic on certain ports
        iifname "erouter0" udp dport { 53, 67, 514 } drop;

        # Allow all other erouter0 traffic
        iifname "erouter0" accept;

        # Allow all non-SYN TCP packets
        tcp flags != syn accept;

        # Allow high-rate UDP DNS, NTP, and DHCP traffic
        iifname "brlan0" udp dport { 53, 123, 547 } limit rate 100/second accept;
        iifname != "brlan0" udp sport { 53, 123 } limit rate 100/second accept;
        iifname != "brlan0" udp dport 546 limit rate 10/second accept;

        # Allow IP encapsulation on erouter0
        iifname "erouter0" ip protocol ipencap accept;

        # Drop unauthorized SNMP access
        iifname "erouter0" udp dport 161 drop;
        iifname != "brlan0" udp dport 161 accept;

        # Allow specific VLAN interfaces
        iifname { "brlan2", "brlan3", "brlan4", "brlan5", "brpublic" } accept;

        # Log remaining packets
        jump log_input_drop;
    }
    chain forward {
        type filter hook forward priority 0; policy accept;

        oifname "erouter0" ct state invalid drop;
        ip daddr 172.31.255.0/24 drop;
        ip daddr 192.168.100.1/32 iifname "brlan0" drop;
        iifname "brlan1" oifname "privbr" tcp dport { 22, 23, 80, 443 } drop;
        iifname "br403" oifname "erouter0" accept;
        iifname "erouter0" oifname "br403" accept;

        # Drop TCP traffic on specific ports from br106 to privbr
        iifname "br106" oifname "privbr" tcp dport { 22, 23, 80, 443 } drop;

        jump general_forward;

        iifname "erouter0" oifname "brlan0" jump wan2lan;
        iifname "brlan0" oifname "erouter0" jump lan2wan;

        iifname "brlan0" oifname "brlan0" accept;

        # Drop traffic between ath12 and other interfaces
        iifname "ath12" oifname "erouter0" drop;
        iifname "brlan0" oifname "ath12" drop;
        iifname "brlan1" oifname "ath12" drop;
        iifname "ath12" oifname "brlan0" drop;
        iifname "ath12" oifname "brlan1" drop;
        iifname "erouter0" oifname "ath12" drop;

        # Drop traffic between ath13 and other interfaces
        iifname "ath13" oifname "erouter0" drop;
        iifname "brlan0" oifname "ath13" drop;
        iifname "brlan1" oifname "ath13" drop;
        iifname "ath13" oifname "brlan0" drop;
        iifname "ath13" oifname "brlan1" drop;
        iifname "erouter0" oifname "ath13" drop;

        iifname "brlan0" oifname "brlan0" accept;

        jump xlog_drop_wan2lan;

		#ipv6 rule conversion
        # Drop invalid packets going out of erouter0
        oifname "erouter0" ct state invalid drop;

        # Drop restricted TCP ports on specific interfaces
        iifname "brlan1" oifname "privbr" tcp dport { 22, 23, 80, 443 } drop;
        iifname "br106" oifname "privbr" tcp dport { 22, 23, 80, 443 } drop;
        iifname "brlan1" oifname "erouter0" tcp dport { 22, 8080, 8181 } drop;
        iifname "br106" oifname "erouter0" tcp dport { 22, 8080, 8181 } drop;

        # Allow internal network forwarding
        iifname "brlan0" oifname "brlan0" jump lan2wan;

        # Log routing-type 0 packets
        rt type 0 jump log_forward_drop;

        # Allow intra-interface forwarding for VLANs
        iifname { "brlan2", "brlan3", "brlan4", "brlan5", "brpublic" } oifname { "brlan2", "brlan3", "brlan4", "brlan5", "brpublic" } accept
;
        # Log unwanted IPv6 addresses
        ip6 saddr { fe80::/64, ff00::/8, ec00::/10, ::/96 } jump log_forward_drop;
        ip6 daddr { fe80::/64, ff08::/16, ec00::/10, ::/96 } jump log_forward_drop;

        # Allow LAN to WAN traffic
        iifname "brlan0" oifname { "brlan0", "erouter0", "mta0" } jump lan2wan;

        # Allow established traffic from WAN interfaces
        iifname { "erouter0", "mta0" } ct state related,established accept;

        # Allow ICMPv6 with rate limits
        ip6 nexthdr icmpv6 icmpv6 type { 1, 3, 4, 145, 147 } limit rate 100/second accept;
        ip6 nexthdr icmpv6 icmpv6 type 2 ct state invalid,new drop;
        ip6 nexthdr icmpv6 icmpv6 type 2 limit rate 100/second accept;

        # Allow WAN to LAN traffic for VPN protocols
        iifname "erouter0" oifname "brlan0" ip protocol { esp, ah, sctp } accept;

        # Log remaining forwarded packets
        jump log_forward_drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;

        ip daddr 192.168.147.0/24 oifname "host0" accept;
        oifname "lo" tcp sport 49152-49153 accept;
        oifname != "brlan0" tcp sport 49152-49153 drop;

        jump general_output;

        ct state related,established accept;
        oifname "brlan0" jump self2lan;
        ct state new accept;

        # Allow loopback
        oifname "lo" accept;
    }

    # Custom chains
    chain log_forward_drop {
        limit rate 1/minute log prefix "UTOPIA: FW.IPv6 FORWARD drop" level info;
        drop;
	}

    chain log_input_drop {
        limit rate 1/minute log prefix "UTOPIA: FW.IPv6 INPUT drop" level info;
        drop;
	}

    chain log_ssh_drop {
        limit rate 1/minute burst 1 packets log prefix "SSH Connection Blocked: " level info;
        drop;
        limit rate 1/minute log prefix "SSH Connection Blocked:" level info;
        drop;
	}

    chain ping_flood {
        limit rate 5/second burst 60 packets accept;
        limit rate 1/minute log prefix "UTOPIA: IPv6 PING FLOOD Drop" level info;
        drop;
	}

    chain snmp_drop_log {
        limit rate 1/minute burst 1 packets log prefix "SNMP DROP Connection Blocked:" level info;
        drop;
        limit rate 1/minute log prefix "SNMP Connection Blocked:" level info;
        drop;
	}

    chain snmp_filter {

	}

    chain ssh_filter {
        accept;
	}

    chain general_forward {

	}

    chain general_input {
        ip saddr != 192.168.100.3 ip daddr 192.168.100.1 iifname "lan0" jump xlog_drop_lan2self;
        ip saddr != 192.168.100.3 ip daddr 192.168.100.1 iifname "brlan0" jump xlog_drop_lan2self;

        iifname "erouter0" udp dport 68 accept;
        iifname "mta0" udp dport 68 accept;
        iifname "brlan0" udp dport 161 jump xlog_drop_lan2self;
	}

    chain general_output {

	}

    chain host_detect {

	}

    chain lan2self {
        ip daddr != 10.0.0.1 jump lan2self_by_wanip;
        jump lan2self_mgmt;
        jump lanattack;
        jump host_detect;
        jump lan2self_plugins;

        ct state new accept;
        ct state related,established accept;
        accept;
	}

    chain lan2self_by_wanip {
        ip daddr 192.168.0.101 return;
        ip saddr 192.168.100.3 ip daddr 192.168.100.1 return;

        ip saddr 10.0.0.0/24 ip daddr { 192.168.101.1, 169.254.101.1, 169.254.0.254, 169.254.1.254, 172.16.12.1, 192.168.106.1, 192.168.251.1 } jump xlog_drop_lan2self;

        tcp dport { 8080, 8181, 80, 443 } jump xlog_drop_lan2self;
        udp dport 161 jump xlog_drop_lan2self;
        icmp type echo-request jump xlog_drop_lan2self;
	}

    chain lan2self_mgmt {
        tcp dport { 22, 23 } accept;
	}

    chain lan2self_plugins {

	}

    chain lan2wan {
        jump lan2wan_disable;
        jump lan2wan_forwarding_accept;
        jump lan2wan_triggers;
        jump lan2wan_misc;
        jump lan2wan_pc_device;
        jump lan2wan_pc_site;
        jump lan2wan_pc_service;
        jump host_detect;

        ct state new jump xlog_accept_lan2wan;
        ct state related,established jump xlog_accept_lan2wan;
        jump xlog_accept_lan2wan;
        jump lan2wan_dmz_accept;

        jump lan2wan_misc_ipv6;
        jump lan2wan_pc_device;
        jump lan2wan_pc_site;
        jump lan2wan_pc_service;
        accept;
	}

    chain lan2wan_disable {
        ip daddr 169.254.0.0/16 drop;
        ip saddr 169.254.0.0/16 drop;
	}

    chain lan2wan_dmz_accept {}
    chain lan2wan_forwarding_accept {}
    chain lan2wan_misc {}
    chain lan2wan_pc_device {}
    chain lan2wan_pc_service {}
    chain lan2wan_pc_site {}
    chain lan2wan_triggers {}
    chain lan2wan_misc_ipv6 {}
    chain lanattack {
        ip saddr 10.0.0.1 ip daddr 10.0.0.1 jump xlog_drop_lanattack;
        ip saddr 127.0.0.1 jump xlog_drop_lanattack;
        ip daddr 127.0.0.1 jump xlog_drop_lanattack;
	}

    chain lanhosts {

	}

    chain moca_isolation {

	}

    chain self2lan {
        jump self2lan_plugins;
	}

    chain self2lan_plugins {

	}

    chain wan2lan {
        jump wan2lan_disabled;
        jump wan2lan_forwarding_accept;
        jump wan2lan_trigger;
        jump wan2lan_misc;
        jump wan2lan_accept;
        jump wan2lan_plugins;
        jump wan2lan_nonat;
        ct state related,established accept;
        jump host_detect;
        jump wan2lan_dmz;

        ct state invalid jump log_forward_drop;
        return;
	}

    chain wan2lan_accept {
        ip daddr 224.0.0.0/4 accept;
	}

    chain wan2lan_disabled {

	}

    chain wan2lan_dmz {

	}

    chain wan2lan_forwarding_accept {

	}

    chain wan2lan_iot_allow {

	}

    chain wan2lan_misc {
        ct state related,established accept;
        tcp dport 113 jump xlog_drop_wan2lan;
	}

    chain wan2lan_nonat {
        tcp dport 113 return;
        ip daddr 10.0.0.0/24 jump xlog_accept_wan2lan;
	}

    chain wan2lan_plugins {

	}

    chain wan2lan_trigger {

	}

    chain wan2self {
        jump wan2self_allow;
        jump wanattack;
        jump wan2self_ports;
        ct state related,established accept;
        jump xlog_drop_wan2self;
	}

    chain wan2self_allow {}
    chain wan2self_mgmt {
        iifname "erouter0" tcp dport 8080 jump webui_limit;
        iifname "erouter0" tcp dport 8181 jump webui_limit;
        tcp dport { 23, 8080, 80, 443, 8181 } jump xlog_drop_wan2self;
	}

    chain wan2self_ports {
        tcp dport 113 jump xlog_drop_wan2self;
        icmp type echo-request limit rate 3/second jump xlog_accept_wan2self;
        icmp type echo-request limit rate 1/second jump xlog_accept_wan2self;
        ip protocol igmp jump xlog_accept_wan2self;
	}

    chain wanattack {
        icmp type 17 limit rate 6/hour burst 1 packets log prefix "DoS Attack - Smurf Attack";
        icmp type 17 jump xlog_drop_wanattack;
        icmp type 13 limit rate 6/hour burst 1 packets log prefix "DoS Attack - Smurf Attack";
        icmp type 13 jump xlog_drop_wanattack;
        icmp type echo-request limit rate 5/second burst 10 packets return;
        icmp type echo-request limit rate 6/hour burst 1 packets log prefix "DoS Attack - ICMP Flooding";
        icmp type echo-request jump xlog_drop_wanattack;
        tcp flags syn limit rate 10/second burst 20 packets return;
        tcp flags syn limit rate 6/hour burst 1 packets log prefix "DoS Attack - TCP SYN Flooding";
        tcp flags syn jump xlog_drop_wanattack;
        ip saddr 192.168.0.101 ip daddr 224.0.0.0/8 return;
        ip saddr 192.168.0.101 limit rate 6/hour burst 1 packets log prefix "DoS Attack - LAND Attack";
        ip saddr 192.168.0.101 jump xlog_drop_wanattack;
        tcp flags rst limit rate 2/second burst 2 packets jump xlog_accept_wan2lan;
        ip saddr 10.0.0.1 jump xlog_drop_wanattack;
        ip daddr 10.0.0.1 jump xlog_drop_wanattack;
        ip saddr 127.0.0.1 jump xlog_drop_wanattack;
        ip daddr 127.0.0.1 jump xlog_drop_wanattack;
	}

    chain webui_limit {
        ct state related,established accept;
        tcp flags syn limit rate 10/second burst 20 packets accept;
        limit rate 1/second burst 1 packets log prefix "WebUI Rate Limited: ";
        drop;

        ct state related,established accept;
        tcp flags syn limit rate 10/second burst 20 packets accept;
        limit rate 1/second burst 1 packets log prefix "WebUI Rate Limited: " level info;
        drop;
	}

    chain xlog_accept_lan2wan {
		accept;
	}

    chain xlog_accept_wan2lan {
		accept;
	}

    chain xlog_accept_wan2self {
		accept;
	}

    chain xlog_drop_lan2self {
        ct state new limit rate 1/minute burst 1 packets log prefix "UTOPIA: FW.LAN2SELF DROP ";
        drop;
	}

    chain xlog_drop_lan2wan {
        limit rate 1/minute burst 1 packets log prefix "UTOPIA: FW.LAN2WAN DROP ";
        drop;
	}

    chain xlog_drop_lan2wan_misc {
        limit rate 1/minute log prefix "UTOPIA: FW.IPv4 ln2wnmis drop";
        drop;
	}

    chain xlog_drop_lanattack {
        ct state new limit rate 1/minute burst 1 packets log prefix "UTOPIA: FW.LANATTACK DROP ";
        drop;
	}

    chain xlog_drop_wan2lan {

	}

    chain xlog_drop_wan2self {
		drop;
	}

    chain xlog_drop_wanattack {
        ct state new limit rate 1/minute burst 1 packets log prefix "UTOPIA: FW.WANATTACK DROP ";
        drop;
	}

    chain xlogdrop {
		drop;
	}

    chain xlogreject {
        tcp flags syn reject with tcp reset;
        drop;
	}
}
